<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 4-point sparkle star definition -->
    <path id="sparkle" d="M 0 -32 C 1 -7 7 -1 32 0 C 7 1 1 7 0 32 C -1 7 -7 1 -32 0 C -7 -1 -1 -7 0 -32 Z" fill="#bef264"/>
  </defs>

  <!-- Deep Black Favicon Background -->
  <rect width="512" height="512" rx="104" fill="#000000"/>

  <!-- Centered Icon Mark scaled for maximum legibility in browser tabs -->
  <g transform="translate(256, 260) scale(1.65) translate(-256, -245)">
    <!-- 1. The Bold White Letter 'L' -->
    <path d="M 176 236
             L 204 236
             L 204 294
             Q 204 304 214 304
             L 232 304
             Q 234 314 230 324
             L 182 324
             Q 176 324 176 318
             Z"
          fill="#ffffff" />

    <!-- 2. Sweeping White Broom Handle -->
    <path d="M 216 166
             C 242 188 268 232 272 278"
          fill="none"
          stroke="#ffffff"
          stroke-width="16"
          stroke-linecap="round" />

    <!-- 3. Broom Ferrule / Collar (White) -->
    <path d="M 254 282
             Q 272 276 288 288
             Q 284 298 280 302
             Q 265 294 250 292
             Z"
          fill="#ffffff" />

    <!-- 4. Broom Bristles (Lime Green #9fe81d) -->
    <path d="M 250 292
             Q 265 294 280 302
             C 285 328 266 348 244 354
             C 222 358 200 346 202 336
             C 212 340 226 334 232 322
             C 240 308 246 296 250 292 Z"
          fill="#9fe81d" />

    <!-- Bristle Tufts Cut Lines (Black grooves) -->
    <path d="M 222 344 C 236 340 250 328 256 304"
          fill="none"
          stroke="#000000"
          stroke-width="3"
          stroke-linecap="round" />
    <path d="M 240 352 C 252 344 264 332 268 312"
          fill="none"
          stroke="#000000"
          stroke-width="3"
          stroke-linecap="round" />

    <!-- 5. Three Sparkle Stars (Bright Chartreuse #bef264) -->
    <!-- Top Sparkle (Medium) -->
    <g transform="translate(300, 150) scale(0.68)">
      <use href="#sparkle"/>
    </g>

    <!-- Center-Left Sparkle (Largest, Hero Star) -->
    <g transform="translate(284, 202) scale(1.15)">
      <use href="#sparkle"/>
    </g>

    <!-- Bottom-Right Sparkle (Medium-Large) -->
    <g transform="translate(334, 226) scale(0.85)">
      <use href="#sparkle"/>
    </g>
  </g>
</svg>